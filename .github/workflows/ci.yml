name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Never let the test process touch real credentials / provider endpoints.
      ANTHROPIC_AUTH_TOKEN: ""
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_CUSTOM_HEADERS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service]"

      - name: Lint (ruff)
        run: ruff check src/forgeflow tests/forgeflow

      - name: Type check (mypy)
        run: MYPYPATH=src mypy src/forgeflow --explicit-package-bases --python-version 3.11

      - name: Tests (ForgeFlow, offline; online skipped by default)
        run: pytest tests/forgeflow -q

  # Informational Linux re-verify of the upstream suite. The ~14 upstream
  # failures seen on Windows are platform-specific (fcntl/symlink/atomic
  # rename/process management); this job never blocks the main test job.
  upstream-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_AUTH_TOKEN: ""
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_CUSTOM_HEADERS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service]"

      - name: Tests (upstream, offline; informational)
        run: pytest tests --ignore=tests/forgeflow -q
